name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.22', '1.23']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Get dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Run linter
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          args: --timeout=5m

      - name: Build
        run: go build -v ./cmd/server

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run integration tests
        run: |
          go test -v -tags=integration ./test/...
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Test Cross-Compilation
        run: |
          GOOS=darwin GOARCH=amd64 go build -o /dev/null ./cmd/server
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/server
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/server
          GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/server
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/server