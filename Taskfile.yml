# https://taskfile.dev

version: "3"

vars:
  # Binary names
  SERVER_BINARY: mfc
  CLIENT_BINARY: factcheck-curl
  LOADER_BINARY: specloader

  # Directories
  BIN_DIR: ./bin
  DATA_DIR: ./data
  EMBEDDINGS_DIR: ./internal/storage/embeddings
  SPECS_DIR: ./data/specs

  # Go build flags
  GO_FLAGS: -v
  LDFLAGS: -s -w

  # Default spec version
  DRAFT_SPEC_VERSION: draft

env:
  CGO_ENABLED: "0"

# Global options
silent: false
output: prefixed

tasks:
  # Quick Start:
  #   1. task setup                    # Extract specs and generate embeddings (requires OPENAI_API_KEY)
  #   2. task run:server               # Start the MCP server
  #   3. task run:curl -- tools/list   # Test the server
  #
  # Common workflows:
  #   task check                       # Run all quality checks before committing
  #   task dev                         # Start development mode with auto-reload
  #   task test:coverage               # Run tests with coverage report
  #
  # Getting help:
  #   task --list                      # List all available tasks
  #   task --summary <task-name>       # Show detailed info about a task

  # ============================================================================
  # BUILD TASKS
  # ============================================================================

  # Build all binaries
  build:
    desc: Build all binaries
    deps:
      - build:server
      - build:client
      - build:loader
    cmds:
      - echo "All builds complete - binaries in {{.BIN_DIR}}/"

  # Build the main MCP fact-check server binary
  build:server:
    desc: Build the MCP fact-check server
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
      COMMIT:
        sh: git rev-parse --short HEAD 2>/dev/null || echo "none"
      BUILD_DATE:
        sh: date -u '+%Y-%m-%d_%H:%M:%S'
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - echo "Building {{.SERVER_BINARY}} with embedded data..."
      - go build {{.GO_FLAGS}} -ldflags="{{.LDFLAGS}} -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X 'main.buildDate={{.BUILD_DATE}}'" -o {{.BIN_DIR}}/{{.SERVER_BINARY}} ./cmd/server
    sources:
      - ./cmd/server/**/*.go
      - ./pkg/**/*.go
      - ./internal/**/*.go
      - go.mod
      - go.sum
    generates:
      - "{{.BIN_DIR}}/{{.SERVER_BINARY}}"

  # Build the curl-based test client
  build:client:
    desc: Build the fact-check curl client
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - echo "Building {{.CLIENT_BINARY}}..."
      - go build {{.GO_FLAGS}} -ldflags="{{.LDFLAGS}}" -o {{.BIN_DIR}}/{{.CLIENT_BINARY}} ./cmd/factcheck-curl
    sources:
      - ./cmd/factcheck-curl/**/*.go
      - go.mod
      - go.sum
    generates:
      - "{{.BIN_DIR}}/{{.CLIENT_BINARY}}"

  # Build the spec loader utility for extracting and embedding specs
  build:loader:
    desc: Build the spec loader utility
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - echo "Building {{.LOADER_BINARY}}..."
      - go build {{.GO_FLAGS}} -ldflags="{{.LDFLAGS}}" -o {{.BIN_DIR}}/{{.LOADER_BINARY}} ./utils/cmd
    sources:
      - ./utils/**/*.go
      - ./internal/**/*.go
      - go.mod
      - go.sum
    generates:
      - "{{.BIN_DIR}}/{{.LOADER_BINARY}}"

  # ============================================================================
  # CODE QUALITY TASKS
  # ============================================================================

  # Run all linters but don't fail on errors (for quick checks)
  lint:
    desc: Run linter, report lint issues (doesn't fail on lint errors)
    cmds:
      - cmd: golangci-lint run --timeout 5m
        ignore_error: true
    preconditions:
      - sh: command -v golangci-lint
        msg: "golangci-lint is not installed. Please install it: https://golangci-lint.run/usage/install/"

  # Run linters and automatically fix issues where possible
  lint:fix:
    desc: Run linter, apply fixes.
    cmds:
      - golangci-lint run --fix ./...

  # Lint markdown files
  lint:md:
    desc: Lint markdown files
    cmds:
      - markdownlint '**/*.md' --ignore node_modules --ignore bin --ignore vendor
    preconditions:
      - sh: command -v markdownlint
        msg: "markdownlint is not installed. Install it with: npm install -g markdownlint-cli"

  # Run all linters (Go and Markdown)
  lint:all:
    desc: Run all linters (Go and Markdown)
    cmds:
      - task: lint
      - task: lint:md

  # Format all Go code according to gofmt standards
  fmt:
    desc: Format Go code
    cmds:
      - go fmt ./...
      - 'echo "Code formatted"'

  # Run Go's built-in static analysis tool
  vet:
    desc: Run go vet
    cmds:
      - go vet ./...
      - 'echo "Vet complete"'

  # Run all code quality checks in sequence
  check:
    desc: Run all checks (fmt, vet, lint, test)
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: test

  # ============================================================================
  # TESTING TASKS
  # ============================================================================

  # Run all unit tests with verbose output (exclude e2e tests)
  test:
    desc: Run unit tests
    cmds:
      - go test -v -shuffle=on ./cmd/... ./internal/... ./pkg/... ./utils/...

  # Run tests and generate HTML coverage report
  test:coverage:
    desc: Run tests with coverage report
    cmds:
      - go test -v -shuffle=on -coverprofile=coverage.out ./cmd/... ./internal/... ./pkg/... ./utils/...
      - go tool cover -html=coverage.out -o coverage.html
      - 'echo "Coverage report generated: coverage.html"'

  # Run end-to-end tests (requires valid OPENAI_API_KEY for full tests)
  # These tests validate the MCP tool handlers with actual embeddings
  # Example:
  #   export OPENAI_API_KEY=sk-...
  #   task test:e2e
  test:e2e:
    desc: Run end-to-end tests (parallel with random order)
    deps: [build]
    cmds:
      - go test -v -shuffle=on ./test/e2e/...

  # Run all tests including both unit and e2e tests
  # Note: e2e tests require OPENAI_API_KEY to be set
  test:all:
    desc: Run all tests (unit and e2e)
    deps: [test, test:e2e]

  # ============================================================================
  # RUN/DEVELOPMENT TASKS
  # ============================================================================

  # Run the MCP server (builds first if needed)
  # The server will use stdio transport by default for MCP communication
  # Example:
  #   task run:server
  run:server:
    desc: Run the MCP fact-check server
    deps: [build:server]
    cmds:
      - "{{.BIN_DIR}}/{{.SERVER_BINARY}}"

  # Run the curl client to test the server
  # Examples:
  #   task run:curl -- tools/list
  #   task run:curl -- tools/call search_spec '{"query":"initialization"}'
  #   task run:curl -- tools/call validate_code '{"code":"import mcp from \"@modelcontextprotocol/sdk\""}'
  run:curl:
    desc: Run factcheck-curl to test the server
    deps: [build:client]
    cmds:
      - "{{.BIN_DIR}}/{{.CLIENT_BINARY}} --cmd {{.BIN_DIR}}/{{.SERVER_BINARY}} {{.CLI_ARGS}}"

  # Watch files and auto-rebuild/restart server on changes
  # Requires 'entr' to be installed: https://github.com/eradman/entr
  # Example:
  #   task dev
  # Then edit any .go file and the server will automatically restart
  dev:
    desc: Development mode - rebuild and run server on file changes
    deps: [build:server]
    cmds:
      - 'echo "Starting development mode (requires entr to be installed)..."'
      - find . -name "*.go" | entr -r task run:server

  # ============================================================================
  # DATA MANAGEMENT TASKS
  # ============================================================================

  # Extract MCP specification from GitHub for a specific version
  # Examples:
  #   task extract:spec                    # extracts draft version (default)
  #   task extract:spec -- draft           # extracts draft version
  #   task extract:spec -- 2025-06-18      # extracts specific version
  #   task extract:spec -- 2024-11-05      # extracts older version
  extract:spec:
    desc: Extract an MCP specification from GitHub. Default is Draft.
    deps: [build:loader]
    vars:
      VERSION: "{{.CLI_ARGS | default .DRAFT_SPEC_VERSION}}"
    cmds:
      - "{{.BIN_DIR}}/{{.LOADER_BINARY}} spec --version {{.VERSION}}"
      - 'echo "Extracted spec version {{.VERSION}}"'
      - 'echo "Extracting fine-grained spec chunks..."'
      - "{{.BIN_DIR}}/{{.LOADER_BINARY}} rechunk --version {{.VERSION}} --output {{.SPECS_DIR}}/{{.VERSION}}-spec-fine.json"
      - 'echo "Extracted fine-grained spec version {{.VERSION}}"'

  # Generate vector embeddings for a spec version
  # Examples:
  #   task generate:embeddings              # generates for draft (default)
  #   task generate:embeddings -- draft     # generates for draft
  #   task generate:embeddings -- 2025-06-18  # generates for specific version
  # Note: Requires OPENAI_API_KEY environment variable to be set
  generate:embeddings:
    desc: Generate embeddings for a spec version. Default is Draft.
    deps: [build:loader]
    vars:
      VERSION: "{{.CLI_ARGS | default .DRAFT_SPEC_VERSION}}"
    cmds:
      - "{{.BIN_DIR}}/{{.LOADER_BINARY}} embed --version {{.VERSION}}"
      - 'echo "Generated embeddings for version {{.VERSION}}"'
      - 'echo "Generating fine-grained embeddings..."'
      - "{{.BIN_DIR}}/{{.LOADER_BINARY}} embed --version {{.VERSION}}-fine"
      - 'echo "Generated fine-grained embeddings for version {{.VERSION}}"'

  # Extract and generate embeddings for all supported spec versions
  # This task runs automatically for all versions: draft, 2025-06-18, 2025-03-26, 2024-11-05
  # Note: Requires OPENAI_API_KEY environment variable to be set
  # Example:
  #   export OPENAI_API_KEY=sk-...
  #   task setup
  setupallspecs:
    desc: Initial setup - extract specs and generate embeddings for all versions (regular and fine-grained)
    deps: [build:loader]
    cmds:
      - mkdir -p {{.SPECS_DIR}} {{.EMBEDDINGS_DIR}}
      - for: [draft, "2025-06-18", "2025-03-26", "2024-11-05"]
        cmd: |
          echo "Processing version {{.ITEM}}..."
          echo "  Extracting regular spec chunks..."
          {{.BIN_DIR}}/{{.LOADER_BINARY}} spec --version {{.ITEM}}
          echo "  Extracting fine-grained spec chunks..."
          {{.BIN_DIR}}/{{.LOADER_BINARY}} rechunk --version {{.ITEM}} --output {{.SPECS_DIR}}/{{.ITEM}}-spec-fine.json
          echo "  Generating regular embeddings..."
          {{.BIN_DIR}}/{{.LOADER_BINARY}} embed --version {{.ITEM}}
          echo "  Generating fine-grained embeddings..."
          {{.BIN_DIR}}/{{.LOADER_BINARY}} embed --version {{.ITEM}}-fine
      - echo "Completed setup for all spec versions with regular and fine-grained chunks"

  # Show which spec versions have embeddings available
  list:versions:
    desc: List available MCP spec versions in embeddings
    cmds:
      - 'ls -la {{.EMBEDDINGS_DIR}}/*.json 2>/dev/null | awk -F"/" "{print \$NF}" | sed "s/.json//" || echo "No embeddings found. Run ''task setup'' first."'

  # ============================================================================
  # RELEASE TASKS
  # ============================================================================

  # Test release process locally without publishing
  release:test:
    desc: Test release locally with GoReleaser (doesn't publish)
    cmds:
      - goreleaser release --snapshot --clean --skip=publish
    preconditions:
      - sh: command -v goreleaser
        msg: "goreleaser is not installed. See https://goreleaser.com/install/ for installation instructions"

  # Create a new release and push tag
  release:
    desc: Create a new release (tags and pushes to trigger GitHub release)
    vars:
      CURRENT_VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo "v0.0.0"
    cmds:
      - echo "Current version{{":"}} {{.CURRENT_VERSION}}"
      - |
        read -p "Enter new version (e.g., v0.1.0): " VERSION
        if [ -z "$VERSION" ]; then
          echo "Version required"
          exit 1
        fi
        git tag -a $VERSION -m "Release $VERSION"
        git push origin $VERSION
        echo "Pushed tag $VERSION. GitHub Actions will create the release."

  # Tag a version without pushing (for manual control)
  tag:
    desc: Tag a new version without pushing
    vars:
      CURRENT_VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo "v0.0.0"
    cmds:
      - echo "Current version{{":"}} {{.CURRENT_VERSION}}"
      - |
        read -p "Enter new version (e.g., v0.1.0): " VERSION
        if [ -z "$VERSION" ]; then
          echo "Version required"
          exit 1
        fi
        git tag -a $VERSION -m "Release $VERSION"
        echo "Tagged $VERSION. Run 'git push origin $VERSION' to trigger release."

  # ============================================================================
  # BENCHMARKING & PROFILING TASKS
  # ============================================================================

  # Run benchmarks
  bench:
    desc: Run all benchmarks
    cmds:
      - go test -bench=. -benchmem ./...

  # Run specific benchmark with custom settings
  bench:validation:
    desc: Run validation benchmarks
    cmds:
      - go test -bench=BenchmarkChunkValidation -benchtime=10x ./internal/capabilities/tools/validation

  # Generate CPU profile
  profile:cpu:
    desc: Generate CPU profile for the server
    cmds:
      - mkdir -p profiles
      - go test -cpuprofile=profiles/cpu.prof -bench=. ./internal/capabilities/tools/validation
      - echo "CPU profile saved to profiles/cpu.prof"
      - echo "View with{{":"}} go tool pprof -http=:8080 profiles/cpu.prof"

  # Generate memory profile
  profile:mem:
    desc: Generate memory profile for the server
    cmds:
      - mkdir -p profiles
      - go test -memprofile=profiles/mem.prof -bench=. ./internal/capabilities/tools/validation
      - echo "Memory profile saved to profiles/mem.prof"
      - echo "View with{{":"}} go tool pprof -http=:8080 profiles/mem.prof"

  # ============================================================================
  # DOCKER TASKS
  # ============================================================================

  # Build Docker image locally
  docker:build:
    desc: Build Docker image
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
    cmds:
      - docker build -t mfc:{{.VERSION}} -t mfc:latest .
      - echo "Built Docker image mfc{{":"}}{{.VERSION}}"

  # Run Docker container
  docker:run:
    desc: Run Docker container
    cmds:
      - docker run --rm -e OPENAI_API_KEY=${OPENAI_API_KEY} mfc:latest

  # ============================================================================
  # UTILITY TASKS
  # ============================================================================

  # Generate mocks for testing
  mocks:
    desc: Generate mocks for interfaces
    cmds:
      - go generate ./...
      - echo "Mocks generated"

  # Update all dependencies to latest versions
  deps:update:
    desc: Update all dependencies to latest versions
    cmds:
      - go get -u ./...
      - go mod tidy
      - echo "Dependencies updated to latest versions"

  # Check for dependency vulnerabilities
  vuln:
    desc: Check for known vulnerabilities in dependencies
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Show binary size breakdown
  size:
    desc: Show binary size breakdown
    deps: [build:server]
    cmds:
      - go tool nm -size {{.BIN_DIR}}/{{.SERVER_BINARY}} | head -20
      - echo ""
      - echo "Total size{{":"}} $(ls -lh {{.BIN_DIR}}/{{.SERVER_BINARY}} | awk '{print $5}')"

  # ============================================================================
  # MAINTENANCE TASKS
  # ============================================================================

  # Remove all build artifacts and generated files
  clean:
    desc: Clean build artifacts and generated files
    cmds:
      - rm -rf {{.BIN_DIR}}
      - rm -f coverage.out coverage.html
      - go clean -cache
      - 'echo "Cleaned build artifacts"'

  # Download and update Go module dependencies
  deps:
    desc: Download and tidy Go dependencies
    cmds:
      - go mod download
      - go mod tidy
      - 'echo "Dependencies updated"'

  # Install built binaries to system GOPATH
  install:
    desc: Install binaries to GOPATH/bin
    deps: [build]
    cmds:
      - cp {{.BIN_DIR}}/{{.SERVER_BINARY}} $(go env GOPATH)/bin/
      - cp {{.BIN_DIR}}/{{.CLIENT_BINARY}} $(go env GOPATH)/bin/
      - cp {{.BIN_DIR}}/{{.LOADER_BINARY}} $(go env GOPATH)/bin/
      - 'echo "Installed binaries to $(go env GOPATH)/bin/"'

  # Remove installed binaries from system GOPATH
  uninstall:
    desc: Remove installed binaries from GOPATH/bin
    cmds:
      - rm -f $(go env GOPATH)/bin/{{.SERVER_BINARY}}
      - rm -f $(go env GOPATH)/bin/{{.CLIENT_BINARY}}
      - rm -f $(go env GOPATH)/bin/{{.LOADER_BINARY}}
      - 'echo "Removed binaries from $(go env GOPATH)/bin/"'
